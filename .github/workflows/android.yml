name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --console=plain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: build-reports
          path: app/build/reports/

  device-tests:
    timeout-minutes: 20
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Enable KVM
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: |
            test_status=0
            ./gradlew connectedDebugAndroidTest --console=plain || test_status=$?
            mkdir -p screenshots
            adb pull /sdcard/Android/data/com.briancodez.padstudio/files/. screenshots/ || true
            exit "$test_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: device-tests-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            screenshots/

  release:
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    needs: device-tests
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Restore signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'padstudio-release.p12'
          key.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          key.chmod(0o600)
          password = os.environ['KEYSTORE_PASSWORD']
          props = Path('signing.properties')
          props.write_text(f'storeFile={key}\nstorePassword={password}\nkeyAlias=padstudio\nkeyPassword={password}\n')
          props.chmod(0o600)
          PY
      - name: Build signed APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          ./gradlew assembleRelease --console=plain
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          version = metadata['elements'][0]['versionName']
          if os.environ['RELEASE_TAG'] != 'v' + version:
              raise SystemExit('Release tag must match the APK versionName')
          PY
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/PadStudio.apk
          cd release
          sha256sum PadStudio.apk > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/PadStudio.apk release/SHA256SUMS.txt --title "PadStudio $RELEASE_TAG" --notes-file RELEASE_NOTES.md --verify-tag
      - name: Remove signing material
        if: always()
        run: rm -f signing.properties "$RUNNER_TEMP/padstudio-release.p12"

plugins { id 'com.android.application' }

android {
    namespace 'com.briancodez.padstudio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.briancodez.padstudio'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def signingFile = rootProject.file('signing.properties')
    if (signingFile.exists()) {
        def signingValues = new Properties()
        signingFile.withInputStream { signingValues.load(it) }
        signingConfigs {
            release {
                storeFile file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    testOptions { unitTests.returnDefaultValues = true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
